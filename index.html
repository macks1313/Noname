<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Le Journal du Capitaine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <div>
                <span class="eyebrow">JOURNAL DE BORD</span>
                <h1>Le Capitaine</h1>
            </div>

            <div class="gold">
                🪙 <span id="coins">0</span>
            </div>
        </header>


        <section class="compass-card">

            <div class="compass" id="compass">

                <div class="direction north">N</div>
                <div class="direction east">E</div>
                <div class="direction south">S</div>
                <div class="direction west">O</div>

                <div class="needle"></div>

                <div class="compass-center">
                    ⚓
                </div>

            </div>

            <div class="heading">
                CAP <strong id="heading">000°</strong>
            </div>

        </section>


        <section class="map-card">

            <div class="map-title">
                <span>CARTE DES MERS</span>
                <span id="coordinates">X 042 · Y 087</span>
            </div>

            <div class="map" id="map">

                <div class="island island-one">☠️</div>
                <div class="island island-two">🏝️</div>
                <div class="island island-three">🏝️</div>

                <div class="ship" id="ship">
                    ⛵
                </div>

                <div class="treasure" id="treasure">
                    ✕
                </div>

            </div>

        </section>


        <section class="message-card">

            <span class="eyebrow">MESSAGE DU JOUR</span>

            <p id="message">
                La mer est calme...
                mais quelque chose approche.
            </p>

            <button id="discover">
                🔭 Explorer les environs
            </button>

        </section>


        <footer>
            JOUR <span id="day">01</span>
            ·
            MISSION <span id="mission">INCONNUE</span>
        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>

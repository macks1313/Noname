<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>THE RULES</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="flash"></div>

    <main id="game">

        <header>
            <div class="logo">THE RULES</div>
            <div class="session">
                SESSION <span id="sessionNumber">001</span>
            </div>
        </header>


        <section id="intro" class="screen active">

            <div class="intro-content">

                <div class="tiny">AN INTERACTIVE EXPERIMENT</div>

                <h1>
                    THERE<br>
                    ARE<br>
                    <span>NO RULES.</span>
                </h1>

                <p>
                    Or maybe there are.
                </p>

                <button id="startButton">
                    BEGIN
                </button>

            </div>

        </section>


        <section id="gameScreen" class="screen">

            <div id="ruleNumber">
                RULE #01
            </div>

            <div id="ruleText">
                There are no rules.
            </div>


            <div id="arena">

                <button id="mysteryButton">
                    <span id="buttonText">DO SOMETHING</span>
                </button>

                <div id="objects"></div>

            </div>


            <div class="bottom">

                <div>
                    <span class="label">DISCOVERED</span>
                    <strong id="discovered">0</strong>
                </div>

                <div>
                    <span class="label">ACTIONS</span>
                    <strong id="actions">0</strong>
                </div>

                <div>
                    <span class="label">RULES</span>
                    <strong id="rulesFound">1</strong>
                </div>

            </div>

        </section>


        <section id="ending" class="screen">

            <div class="ending-content">

                <div class="tiny">EXPERIMENT COMPLETE</div>

                <h2 id="endingTitle">
                    YOU FOUND<br>
                    SOMETHING.
                </h2>

                <p id="endingText"></p>

                <div class="stats">
                    <div>
                        <span>ACTIONS</span>
                        <strong id="finalActions">0</strong>
                    </div>

                    <div>
                        <span>RULES</span>
                        <strong id="finalRules">0</strong>
                    </div>

                    <div>
                        <span>DISCOVERIES</span>
                        <strong id="finalDiscoveries">0</strong>
                    </div>
                </div>

                <button id="restartButton">
                    AGAIN
                </button>

            </div>

        </section>

    </main>


    <div id="notification"></div>

    <script src="app.js"></script>

</body>
</html>

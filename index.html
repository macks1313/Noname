<div id="game"></div>
<div id="top"><div class="brand">♛ LADY BRIEFINGTON</div><div class="tag">Lost in the laundry. Found by destiny.</div><div class="day">BRIEFSVILLE · DAY <b id="day">001</b></div></div>

<div id="panel"><button class="close" id="closePanel">✕</button><h2 id="panelTitle"></h2><div id="panelBody"></div></div>
<div id="dialog"><strong>Lady Briefington</strong><p id="dialogText"></p><button id="dialogClose">Dismiss</button></div><div id="toast"></div><div id="loadError"><div class="box"><h2>Briefsville is not responding</h2><p id="loadErrorText">The 3D world could not start.</p><button onclick="location.reload()">Try again</button></div></div>
<script src="./three.min.js"></script>
<script>
function showLoadError(message){const e=document.getElementById("loadError");document.getElementById("loadErrorText").textContent=message;e.style.display="flex"}
function boot(){
const THREE=window.THREE,root=document.getElementById("game");
if(!THREE){showLoadError("The 3D engine did not load. Check your internet connection and reload.");return}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"})}
catch(error){showLoadError("Your browser could not start WebGL, which is required to display the 3D city. Try opening this page directly in Safari instead of the in-app browser.");return}

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb7c1);scene.fog=new THREE.Fog(0x9bb7c1,24,100);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,180);camera.position.set(0,1.7,12);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x6c594b,1.35));const sun=new THREE.DirectionalLight(0xffe3bd,1.4);sun.position.set(-20,35,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r===undefined?.85:r});
const grass=mat(0x63805a),road=mat(0x454650),sidewalk=mat(0xb9a58b),brick=mat(0x94766e),cream=mat(0xd8c6a9),roof=mat(0x544452),windowMat=new THREE.MeshStandardMaterial({color:0xf5dca0,emissive:0x80602c,emissiveIntensity:.25}),treeMat=mat(0x315b43),trunk=mat(0x5c4538);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function ground(w,d,m,x,z){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,0,z);o.receiveShadow=true;scene.add(o);return o}
ground(150,150,grass,0,0);
box(150,.15,10,road,0,.04,0);box(10,.15,150,road,0,.04,0);
box(150,.18,2,sidewalk,0,.08,6);box(150,.18,2,sidewalk,0,.08,-6);box(2,.18,150,sidewalk,6,.08,0);box(2,.18,150,sidewalk,-6,.08,0);
for(let i=-65;i<=65;i+=8){box(2,.2,2,sidewalk,i,.12,8);box(2,.2,2,sidewalk,i,.12,-8);box(2,.2,2,sidewalk,8,.12,i);box(2,.2,2,sidewalk,-8,.12,i)}
function building(x,z,w,d,h,color){box(w,h,d,mat(color),x,h/2,z);const roofObj=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,Math.min(3,h*.35),4),roof);roofObj.position.set(x,h+1,z);roofObj.rotation.y=Math.PI/4;roofObj.castShadow=true;scene.add(roofObj);for(let y=2;y<h-1;y+=3){for(let side=-1;side<=1;side+=2){box(1.1,1.35,.12,windowMat,x+side*w*.27,y,z+d/2+.07);box(.12,1.35,1.1,windowMat,x+w/2+.07,y,z+side*d*.27)}}}
const colors=[0xb77f72,0x9c8b9d,0xc3a77f,0x718c86,0xa78d79,0x9a7185];
for(let x=-55;x<=55;x+=18){if(Math.abs(x)<11)continue;for(let z of [-24,24])building(x,z,10,9,8+(Math.abs(x)%3)*1.5,colors[Math.abs(x/18)%colors.length|0])}
for(let z=-55;z<=55;z+=18){if(Math.abs(z)<11)continue;for(let x of [-24,24])building(x,z,9,10,8+(Math.abs(z)%3)*1.5,colors[Math.abs(z/18)%colors.length|0])}
function tree(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.2,7),trunk);t.position.set(x,1.1,z);t.castShadow=true;scene.add(t);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,1),treeMat);crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
for(let x=-58;x<=58;x+=13){tree(x,13);tree(x,-13);if(Math.abs(x)>12){tree(x,39);tree(x,-39)}}
function lamp(x,z){const pole=box(.12,4,.12,mat(0x33313b),x,2,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),mat(0xffd98b));bulb.position.set(x,4.1,z);scene.add(bulb)}
for(let i=-45;i<=45;i+=15){lamp(i,5);lamp(5,i)}
// Distinct points of interest
function sign(text,x,z,color){const base=box(3,2,.25,mat(color),x,1.6,z);const canvas=document.createElement("canvas");canvas.width=512;canvas.height=128;const c=canvas.getContext("2d");c.fillStyle="#241e2c";c.fillRect(0,0,512,128);c.fillStyle="#f0cf91";c.font="bold 48px Georgia";c.textAlign="center";c.fillText(text,256,82);const tex=new THREE.CanvasTexture(canvas);const board=new THREE.Mesh(new THREE.PlaneGeometry(3,0.75),new THREE.MeshBasicMaterial({map:tex}));board.position.set(x,2.6,z+.14);scene.add(board);return base}
sign("THE LAUNDRY",-16,-15,0x8a6e89);building(-16,-20,9,8,7,0x9a7881);
sign("THRIFT SHOP",18,-16,0x8a6e89);building(18,-21,9,8,7,0xb78f75);
sign("THE DRUNKEN SOCK",-18,17,0x8a6e89);building(-18,22,10,8,8,0x7c8292);
sign("LOST THINGS MUSEUM",18,17,0x8a6e89);building(18,22,11,9,10,0xb49b78);
// Character: a little animated anthropomorphic lace-panties silhouette
const lady=new THREE.Group();const cloth=new THREE.Mesh(new THREE.SphereGeometry(.62,16,12),new THREE.MeshStandardMaterial({color:0xf2dfc7,roughness:.65}));cloth.scale.set(1.12,.78,.42);cloth.position.y=1.55;cloth.castShadow=true;lady.add(cloth);
const trim=new THREE.Mesh(new THREE.TorusGeometry(.53,.055,8,24),mat(0xc99b9e));trim.position.set(0,1.33,.04);trim.scale.set(1.12,.55,.7);lady.add(trim);
const eyeMat=mat(0x392638);for(let x of [-.2,.2]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),eyeMat);eye.position.set(x,1.67,.4);lady.add(eye)}
const monocle=new THREE.Mesh(new THREE.TorusGeometry(.16,.025,8,20),mat(0xc99b50));monocle.position.set(.24,1.68,.42);lady.add(monocle);
const pearls=new THREE.Mesh(new THREE.TorusGeometry(.38,.045,8,24),mat(0xffebd1));pearls.position.set(0,1.17,.03);pearls.scale.set(1,.7,.8);lady.add(pearls);
const legs=[];for(let x of [-.25,.25]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,.65,8),mat(0xe5bda9));leg.position.set(x,.55,0);lady.add(leg);legs.push(leg)}
const bow=new THREE.Mesh(new THREE.SphereGeometry(.15,8,8),mat(0xb65d83));bow.scale.set(1.4,.7,.4);bow.position.set(0,2.03,0);lady.add(bow);
lady.position.set(28,0,-30);scene.add(lady);lady.userData={target:new THREE.Vector3(28,0,-30),walk:0};
const hitObjects=[cloth];cloth.userData.isLady=true;
const raycaster=new THREE.Raycaster(),center=new THREE.Vector2(0,0);let yaw=0,pitch=0,moveX=0,moveY=0,lookX=0,lookY=0,nearLady=false,started=true,dialogue=false,lastTime=performance.now();
const state={day:1,hunger:66,energy:82,mood:78,sleep:74,hygiene:43,health:100,money:14,art:0,events:["Lady Briefington was last spotted somewhere in Briefsville."]};
const meterNames=[["Hunger","hunger"],["Energy","energy"],["Mood","mood"],["Sleep","sleep"],["Hygiene","hygiene"],["Health","health"]];
function renderMeters(){document.getElementById("meters").innerHTML=meterNames.map(([n,k])=>'<div class="meter"><div class="meterhead"><span>'+n+'</span><b>'+state[k]+'%</b></div><div class="track"><div class="fill" style="width:'+state[k]+'%"></div></div></div>').join("");document.getElementById("day").textContent=String(state.day).padStart(3,"0")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900)}
function showPanel(title,body){document.getElementById("panelTitle").textContent=title;document.getElementById("panelBody").innerHTML=body;document.getElementById("panel").style.display="block"}
function openTalk(){dialogue=true;document.getElementById("dialogText").textContent="“Darling! You found me. I was conducting an extremely important inspection of the pavement. It is dreadful, by the way. Now, tell me: have you come to admire me, or are you here to waste my time?”";document.getElementById("dialog").style.display="block";state.mood=Math.min(100,state.mood+2);renderMeters()}
document.getElementById("dialogClose").onclick=()=>{dialogue=false;document.getElementById("dialog").style.display="none"};
document.getElementById("closePanel").onclick=()=>document.getElementById("panel").style.display="none";
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{const p=b.dataset.page;const data={Journal:["Lady's Journal","<p>Day "+state.day+": Briefsville is tolerable. The locals are not.</p><p class='small'>Her diary will grow as the world simulation develops.</p>"],Gallery:["The Gallery","<p>Works on display: "+state.art+"</p><p class='small'>Lady Briefington is preparing her first collection, <em>Elegance in Exile</em>.</p>"],Inventory:["Personal Effects","<p>One pearl necklace · One gold monocle · A very strong opinion of herself.</p>"],Shop:["The Boutique","<p>The shop is not open yet. Lady Briefington is currently negotiating an unreasonable commission.</p>"]};showPanel(data[p][0],data[p][1])});
document.getElementById("interact").onclick=openTalk;
// Desktop mouse look and pointer lock

document.addEventListener("mousemove",e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0022;pitch=Math.max(-1.15,Math.min(1.15,pitch-e.movementY*.0022))}});
function isCoarse(){return matchMedia("(pointer:coarse)").matches}
function onPointerStick(el,knob,cb){let active=false,id=null;el.addEventListener("pointerdown",e=>{active=true;id=e.pointerId;el.setPointerCapture(id);update(e)});el.addEventListener("pointermove",e=>{if(active&&e.pointerId===id)update(e)});function end(e){if(e.pointerId!==id)return;active=false;id=null;knob.style.transform="translate(0,0)";cb(0,0)}el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);function update(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width*.34),dy=(e.clientY-cy)/(r.height*.34);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}knob.style.transform="translate("+dx*30+"px,"+dy*30+"px)";cb(dx,dy)}}
onPointerStick(document.getElementById("moveStick"),document.getElementById("moveKnob"),(x,y)=>{moveX=x;moveY=y});
onPointerStick(document.getElementById("lookstick"),document.getElementById("lookKnob"),(x,y)=>{lookX=x;lookY=y});
let touchLook=null;renderer.domElement.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&e.clientX>innerWidth*.42){touchLook={x:e.clientX,y:e.clientY,id:e.pointerId}}});renderer.domElement.addEventListener("pointermove",e=>{if(touchLook&&touchLook.id===e.pointerId){yaw-=(e.clientX-touchLook.x)*.004;pitch=Math.max(-1.15,Math.min(1.15,pitch-(e.clientY-touchLook.y)*.004));touchLook.x=e.clientX;touchLook.y=e.clientY}});renderer.domElement.addEventListener("pointerup",()=>touchLook=null);
function updateCamera(){camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch}
function clampPos(v){v.x=Math.max(-67,Math.min(67,v.x));v.z=Math.max(-67,Math.min(67,v.z));if(Math.abs(v.x)<5)v.x=Math.sign(v.x||1)*5;if(Math.abs(v.z)<5)v.z=Math.sign(v.z||1)*5;return v}
function wander(dt){lady.userData.walk+=dt;if(lady.userData.walk>5){lady.userData.walk=0;lady.userData.target.set((Math.random()-.5)*75,0,(Math.random()-.5)*75)}const dir=lady.userData.target.clone().sub(lady.position);dir.y=0;if(dir.length()>.6){dir.normalize();lady.position.addScaledVector(dir,dt*.8);lady.rotation.y=Math.atan2(dir.x,dir.z);legs[0].rotation.x=Math.sin(performance.now()*.008)*.35;legs[1].rotation.x=-legs[0].rotation.x}}
function checkLady(){const dist=camera.position.distanceTo(new THREE.Vector3(lady.position.x,1.3,lady.position.z));nearLady=dist<4.3;document.getElementById("interact").style.display=nearLady?"block":"none";document.getElementById("hint").textContent=nearLady?"You found her! Talk to Lady Briefington":"Find Lady Briefington somewhere in Briefsville"}
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;if(started){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const v=new THREE.Vector3();v.addScaledVector(forward,-moveY);v.addScaledVector(right,moveX);if(v.length()>0){v.normalize();camera.position.addScaledVector(v,dt*6);clampPos(camera.position);state.energy=Math.max(0,state.energy-dt*.018);state.hunger=Math.max(0,state.hunger-dt*.012)}yaw-=lookX*dt*1.8;pitch=Math.max(-1.15,Math.min(1.15,pitch+lookY*dt*1.3));updateCamera();wander(dt);checkLady();}renderer.render(scene,camera)}
requestAnimationFrame(tick);
if(!isCoarse()){renderer.domElement.addEventListener("click",()=>{if(started&&!document.pointerLockElement)renderer.domElement.requestPointerLock?.()})}
window.addEventListener("keydown",e=>{if(e.key==="w"||e.key==="ArrowUp")moveY=-1;if(e.key==="s"||e.key==="ArrowDown")moveY=1;if(e.key==="a"||e.key==="ArrowLeft")moveX=-1;if(e.key==="d"||e.key==="ArrowRight")moveX=1;if(e.key==="Escape")document.exitPointerLock?.()});
window.addEventListener("keyup",e=>{if(["w","ArrowUp","s","ArrowDown"].includes(e.key))moveY=0;if(["a","ArrowLeft","d","ArrowRight"].includes(e.key))moveX=0});
renderer.domElement.addEventListener("dblclick",()=>{if(nearLady)openTalk()});
renderer.domElement.addEventListener("click",e=>{if(!started||dialogue||document.getElementById("panel").style.display==="block")return;raycaster.setFromCamera(center,camera);const hits=raycaster.intersectObject(cloth,true);if(hits.length&&camera.position.distanceTo(lady.position)<5)openTalk()});
setInterval(()=>{if(started){state.day++;state.hunger=Math.max(0,state.hunger-1);state.energy=Math.max(0,state.energy-1);state.sleep=Math.max(0,state.sleep-1);renderMeters()}},60000);
renderMeters();window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}
window.addEventListener("error",e=>showLoadError("Game startup error: "+(e.message||"unknown JavaScript error")));
window.addEventListener("unhandledrejection",e=>showLoadError("Game startup error: "+(e.reason&&e.reason.message?e.reason.message:"unexpected loading error")));
if(window.THREE){try{boot()}catch(error){showLoadError("Game startup error: "+(error&&error.message?error.message:"unknown error"));console.error(error)}}else{showLoadError("The local 3D engine file could not be loaded. Reload the page; if this continues, the GitHub Pages deployment may still be updating.")}
</script></body></html>

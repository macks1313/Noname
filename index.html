<style>

.overlay{display:none;position:fixed;z-index:10;inset:0;background:rgba(4,12,16,.64);backdrop-filter:blur(14px);align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.sheet{width:min(680px,100%);max-height:82vh;overflow:auto;background:#171c2a;border:1px solid rgba(222,228,241,.18);border-radius:22px;padding:22px;box-shadow:0 30px 90px #0009}.sheethead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:15px;margin-bottom:15px}.sheet h2{font-size:24px;letter-spacing:-.04em;margin:0}.close{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:22px;padding:9px 13px;color:#f4f1e8;font:10px ui-sans-serif,system-ui;font-weight:700}.entry{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}.entry small{font:9px ui-sans-serif,system-ui;color:var(--lime);letter-spacing:.12em}.entry b{display:block;font-size:16px;margin:6px 0}.entry p,.intro{font:12px/1.65 ui-sans-serif,system-ui;color:#b5bac9;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px}.tile b{font-size:14px}.tile p{font:11px/1.5 ui-sans-serif,system-ui;color:#b5bac9}.dialogue{display:flex;flex-direction:column;gap:10px}.bubble{max-width:88%;padding:13px 16px;border-radius:16px;background:#303b55;font:13px/1.55 ui-sans-serif,system-ui;color:#f3f2e9}.bubble.me{align-self:flex-end;background:#ff9279;color:#171a27}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#f2f1e8;border-radius:22px;padding:10px 13px;font:11px ui-sans-serif,system-ui}.field{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#f4f1e8;padding:12px;font:12px ui-sans-serif,system-ui;margin:7px 0}.gold{background:var(--lime);color:#171a27;border:0;border-radius:22px;padding:12px 16px;font:800 10px ui-sans-serif,system-ui;letter-spacing:.08em}.toast{position:fixed;z-index:12;top:78px;left:50%;transform:translateX(-50%);background:#ffe2d9;color:#171a27;padding:11px 17px;border-radius:24px;font:11px ui-sans-serif,system-ui;font-weight:700;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 24px #0005}.toast.show{opacity:1}

</style></head><body>
<div id="world"></div><header class="top"><div class="brand"><div class="seal">L</div><div><b>LADY <span>BRIEFINGTON</span></b><small>LES ÎLES DE BRUME · MONDE À EXPLORER</small></div></div><div class="status" id="clock">MONDE ÉVEILLÉ</div></header>
<div class="help">LES ÎLES DE BRUME · APPROCHE-TOI DE LADY POUR LUI PARLER</div>

<div class="toast" id="toast"></div><div class="overlay" id="overlay"><section class="sheet"><div class="sheethead"><h2 id="title">Journal</h2><button class="close" id="close">FERMER ✕</button></div><div id="body"></div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),host=$('world');
if(!window.THREE){$('doing').textContent='Le monde 3D n’a pas pu se charger. Vérifie ta connexion puis recharge la page.';return}
const THREE=window.THREE,scene=new THREE.Scene();scene.background=new THREE.Color(0x293b43);scene.fog=new THREE.Fog(0x293b43,48,125);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(0,13,17);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9e3df,0x39433f,1.15));const sun=new THREE.DirectionalLight(0xffdfbd,1.55);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const oceanMat=new THREE.MeshStandardMaterial({color:0x24414a,roughness:.32,metalness:.08});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(240,240),oceanMat);ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.2;scene.add(ocean);
// The old hand-built geometric island is removed. The new environment is a real textured GLB scene.
const environmentRoot=new THREE.Group();scene.add(environmentRoot);
const loadingTag=document.createElement('div');loadingTag.textContent='CHARGEMENT DU MONDE…';loadingTag.style.cssText='position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;border-radius:24px;background:#111827dd;color:#f3eee7;font:700 11px system-ui;letter-spacing:.12em;backdrop-filter:blur(12px)';document.body.appendChild(loadingTag);
const gltfLoader=new THREE.GLTFLoader();
gltfLoader.load('https://cdn.3dassets.dev/assets/36160/v1/model.glb',gltf=>{const model=gltf.scene;model.scale.setScalar(1);model.position.set(0,-.9,0);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.FrontSide}}});environmentRoot.add(model);loadingTag.remove();$('doing').textContent='Lady Briefington explore les ruines anciennes.';$('thought').textContent='« Ces pierres ont beaucoup d’histoires à raconter. »'},undefined,err=>{loadingTag.textContent='Le décor 3D n’a pas pu être chargé. Recharge la page.';console.error('GLB load error',err)});
// Landmarks
const places=[{name:'Le Phare des Oubliés',x:-5,z:-7,desc:'Un phare dont la lanterne s’allume parfois sans électricité.'},{name:'La Baie de Verre',x:9,z:-5,desc:'Des éclats de verre marin brillent au bord de l’eau.'},{name:'Le Verger noyé',x:5,z:8,desc:'Des arbres étranges poussent près de la lagune.'},{name:'Les Ruines du Sonneur',x:14,z:11,desc:'Un village oublié derrière les rochers.'},{name:'Le Sentier silencieux',x:-14,z:-14,desc:'Un chemin qui semble changer lorsque personne ne le regarde.'}];
function building(x,z){const stone=mat(0xaaa9a6),wall=new THREE.Mesh(new THREE.CylinderGeometry(.68,.82,3.1,48),stone);wall.position.set(x,1.55,z);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);const trim=new THREE.Mesh(new THREE.TorusGeometry(.7,.065,10,48),mat(0x77798a));trim.position.set(x,2.8,z);scene.add(trim);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.04,.85,48),mat(0x30384f));roof.position.set(x,3.5,z);roof.castShadow=true;scene.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(.34,.82,.07),mat(0x35303a));door.position.set(x,.52,z+.72);scene.add(door);for(let k=0;k<3;k++){const win=new THREE.Mesh(new THREE.BoxGeometry(.17,.28,.07),mat(0x91a5c5,.35));win.position.set(x+(k-1)*.34,1.65,z+.72);scene.add(win)}}
// Les bâtiments sont désormais fournis par le décor GLB.
function label(text,x,z){const cv=document.createElement('canvas');cv.width=512;cv.height=96;const c=cv.getContext('2d');c.fillStyle='rgba(17,22,36,.88)';c.fillRect(4,4,504,88);c.strokeStyle='#ff9279';c.strokeRect(4,4,504,88);c.fillStyle='#f2f1f4';c.font='28px Georgia';c.textAlign='center';c.fillText(text,256,59);const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.position.set(x,2.7,z);sp.scale.set(3.2,.58,1);scene.add(sp)}
places.forEach(p=>label(p.name,p.x,p.z));
// Character models: visitor and Lady are independent agents.
function person(coat,hat){const group=new THREE.Group();const dress=new THREE.Mesh(new THREE.ConeGeometry(.48,1.28,24),mat(coat));dress.position.y=.72;dress.castShadow=true;group.add(dress);const collar=new THREE.Mesh(new THREE.SphereGeometry(.24,20,16),mat(0xf0e5cf));collar.position.y=1.27;collar.scale.set(1,.55,.8);group.add(collar);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,24,20),mat(0xe8c8a6));head.position.y=1.58;group.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.245,20,16),mat(0x51382e));hair.position.set(0,1.68,-.055);hair.scale.set(1.04,1,.92);group.add(hair);const brim=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.045,32),mat(hat));brim.position.y=1.82;group.add(brim);const crown=new THREE.Mesh(new THREE.CylinderGeometry(.22,.25,.25,24),mat(hat));crown.position.y=1.96;group.add(crown);const pack=new THREE.Mesh(new THREE.BoxGeometry(.34,.42,.2),mat(0x6b5137));pack.position.set(0,.78,-.34);group.add(pack);scene.add(group);return group}
const lady=person(0xc94f46,0x303a58);lady.position.set(-5,0,-7);
const beacon=new THREE.Group();
const halo=new THREE.Mesh(new THREE.TorusGeometry(.28,.035,8,36),new THREE.MeshBasicMaterial({color:0xff9279}));halo.position.y=2.65;beacon.add(halo);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.025,.12,1.2,12,1,true),new THREE.MeshBasicMaterial({color:0xff9279,transparent:true,opacity:.22,side:THREE.DoubleSide}));beam.position.y=2.95;beacon.add(beam);lady.add(beacon);
let saved={bag:['Éclat de cuivre gravé','Verre marin bleuté'],found:['Le Phare des Oubliés','La Baie de Verre'],journal:[{day:1,text:'Je suis arrivée sur les Îles de Brume. La brume cache encore bien des choses.'}],letters:[],day:1};
try{saved={...saved,...JSON.parse(localStorage.getItem('lady3d-v1')||'{}')}}catch(e){}
const persist=()=>{try{localStorage.setItem('lady3d-v1',JSON.stringify(saved))}catch(e){}};
let joy={x:0,y:0},pressed=false,keys={},ladyTarget=0,ladyPause=0,last=performance.now(),clock=8*60,visited=new Set(),zoom=1,yaw=0,pitch=-.05,lookDrag=null;
let ladyAction='Elle explore les environs du phare.',ladyThought='Je me demande ce qui se cache derrière ces arbres.';
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function log(t){saved.journal.unshift({day:saved.day,text:t});saved.journal=saved.journal.slice(0,70);persist()}
function arriveLady(p){if(!saved.found.includes(p.name)){saved.found.push(p.name);let item=['Une plume grise','Un fragment de carte','Une petite pierre polie','Une fleur séchée','Une clé rouillée'][saved.bag.length%5];saved.bag.push(item);log('J’ai découvert '+p.name+'. '+p.desc+' J’ai gardé : '+item+'.');ladyAction='Elle a découvert '+p.name+'.';ladyThought=p.desc;say('Lady Briefington a fait une découverte !')}else{ladyAction='Elle observe '+p.name+'.';ladyThought='Je crois que j’avais manqué quelque chose la première fois.'}persist()}
function chooseLady(){ladyTarget=(ladyTarget+1+Math.floor(Math.random()*places.length))%places.length;let p=places[ladyTarget];ladyAction='Elle se dirige vers '+p.name+'.';ladyThought='Un nouvel endroit mérite qu’on s’y attarde.'}
function openTalk(){const html='<div class="dialogue" id="dialogue"><div class="bubble">Bonsoir, voyageur. Vous avez trouvé mon petit coin de brume. Qu’est-ce qui vous amène ?</div><div class="choices"><button data-say="Qui êtes-vous ?">Qui êtes-vous ?</button><button data-say="Que cherchez-vous ?">Que cherchez-vous ?</button><button data-say="Qu’avez-vous découvert ?">Vos découvertes</button><button data-say="Racontez-moi votre voyage.">Votre voyage</button></div><div style="display:flex;gap:7px"><input class="field" id="sayInput" maxlength="180" placeholder="Écrire un message…" style="margin:0"><button class="gold" id="sendSay">ENVOYER</button></div><p class="intro">Dialogue de démonstration : réponses scénarisées, pas encore générées par une IA.</p></div>';$('title').textContent='Une rencontre';$('body').innerHTML=html;$('overlay').classList.add('open');$('close').onclick=()=>{$('overlay').classList.remove('open')};function answer(msg){let low=msg.toLowerCase(),reply=low.includes('qui')?'Je suis Lady Briefington. Cartographe à mes heures, curieuse à toute heure. Ces îles ont encore bien des secrets.':low.includes('cherche')?'Je cherche des traces de ceux qui ont vécu ici. Chaque sentier semble mener à une autre question.':low.includes('découvert')?'J’ai dans mon sac : '+(saved.bag.join(', ')||'pas grand-chose pour le moment')+'. Chaque objet garde un fragment de l’histoire.':low.includes('voyage')?'Je suis arrivée par la mer, un matin où la brume était si épaisse que le monde semblait neuf. Depuis, je suis les chemins qui m’appellent.':'Voilà une pensée intéressante. Je vais la noter dans mon carnet et y réfléchir pendant ma prochaine promenade.';let d=$('dialogue');d.insertAdjacentHTML('beforeend','<div class="bubble me">'+esc(msg)+'</div><div class="bubble">'+esc(reply)+'</div>');d.scrollTop=d.scrollHeight} $('dialogue').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>answer(b.dataset.say));$('sendSay').onclick=()=>{let v=$('sayInput').value.trim();if(v){answer(v);$('sayInput').value=''}}}function panel(name){if(name==='close'){$('overlay').classList.remove('open');return}let title='',html='';if(name==='journal'){title='Journal de bord';html='<p class="intro">Les récits que Lady Briefington écrit au fil de ses aventures.</p>'+saved.journal.map(x=>'<div class="entry"><small>JOUR '+x.day+'</small><p>'+esc(x.text)+'</p></div>').join('')}if(name==='bag'){title='Sac à dos';html='<p class="intro">Les objets qu’elle a récoltés sur les îles.</p><div class="grid">'+saved.bag.map(x=>'<div class="tile"><b>◇ '+esc(x)+'</b><p>Objet trouvé par Lady Briefington.</p></div>').join('')+'</div>'}if(name==='discoveries'){title='Atlas des découvertes';html='<div class="grid">'+places.map(p=>'<div class="tile"><b>'+ (saved.found.includes(p.name)?'✦ ':'◇ ') +esc(p.name)+'</b><p>'+esc(p.desc)+'</p></div>').join('')+'</div>'}if(name==='letter'){title='Lui laisser un message';html='<p class="intro">Dépose un mot pour Lady Briefington. Elle pourra le découvrir quand elle passera près de sa boîte aux lettres.</p><input class="field" id="who" maxlength="30" placeholder="Ton prénom (facultatif)"><textarea class="field" id="letter" rows="4" maxlength="350" placeholder="Ton message…"></textarea><button class="gold" id="send">DÉPOSER LE MESSAGE</button><p class="intro">Les messages sont actuellement conservés sur cet appareil uniquement.</p>'}
$('title').textContent=title;$('body').innerHTML=html;$('overlay').classList.add('open');if(name==='letter')$('send').onclick=()=>{let msg=$('letter').value.trim();if(!msg){say('Écris un message avant de le déposer.');return}saved.letters.push({name:$('who').value.trim()||'Un visiteur',text:msg});log('Un visiteur a déposé une lettre. Je la lirai lorsque je serai de retour.');persist();$('body').innerHTML='<p class="intro">Ton message a été déposé. Il attendra Lady Briefington.</p>';say('Message déposé')}}

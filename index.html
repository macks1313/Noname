<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070c">

<title>L'endroit qui n'existe pas</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03050a;
  color:white;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  touch-action:none;
  user-select:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at center,rgba(25,35,65,.4),#03050a 65%);
  transition:opacity 2s ease,visibility 2s;
}

#intro.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.introInner{
  width:min(700px,88%);
}

.introSmall{
  color:#68738d;
  font:11px Arial,sans-serif;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:28px;
}

h1{
  font-size:clamp(38px,8vw,76px);
  font-weight:400;
  letter-spacing:-3px;
  line-height:.95;
  text-shadow:0 0 50px rgba(150,180,255,.15);
}

.introText{
  margin:28px auto 38px;
  max-width:500px;
  color:#8791a8;
  font-size:16px;
  line-height:1.8;
}

.enter{
  appearance:none;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.035);
  color:#dfe5f2;
  padding:15px 27px;
  border-radius:99px;
  font:12px Arial,sans-serif;
  letter-spacing:3px;
  cursor:pointer;
  transition:.4s;
}

.enter:hover{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.45);
  transform:scale(1.04);
}

#ui{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.top{
  position:absolute;
  top:25px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.title{
  color:rgba(255,255,255,.65);
  font:10px Arial,sans-serif;
  letter-spacing:4px;
  text-transform:uppercase;
}

.visit{
  color:rgba(255,255,255,.3);
  font:10px Arial,sans-serif;
  letter-spacing:1px;
}

#message{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translateX(-50%);
  width:min(650px,85%);
  text-align:center;
  color:rgba(235,240,255,.9);
  font-size:clamp(17px,3vw,24px);
  line-height:1.5;
  opacity:0;
  transition:opacity 1.5s ease;
  text-shadow:0 2px 30px #000;
}

#message.show{
  opacity:1;
}

#hint{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.25);
  font:9px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
}

#memory{
  position:absolute;
  top:55px;
  right:25px;
  color:rgba(255,255,255,.25);
  font:9px Arial,sans-serif;
  letter-spacing:1px;
  text-align:right;
}

@media(max-width:600px){

  .top{
    top:18px;
    left:18px;
    right:18px;
  }

  #memory{
    top:48px;
    right:18px;
  }

  #hint{
    bottom:17px;
  }

  h1{
    letter-spacing:-2px;
  }
}
</style>
</head>

<body>

<canvas id="world"></canvas>

<div id="intro">

  <div class="introInner">

    <div class="introSmall">
      Somewhere that isn't anywhere
    </div>

    <h1>
      L'endroit qui<br>
      n'existe pas.
    </h1>

    <div class="introText">
      Il n'y a rien à gagner ici.<br>
      Rien à acheter. Rien à accomplir.<br><br>
      Promène-toi simplement.
    </div>

    <button class="enter" id="enter">
      ENTRER
    </button>

  </div>

</div>


<div id="ui">

  <div class="top">

    <div class="title">
      L'ENDROIT QUI N'EXISTE PAS
    </div>

    <div class="visit">
      VISITE <span id="visitNumber">01</span>
    </div>

  </div>

  <div id="memory"></div>

  <div id="message"></div>

  <div id="hint">
    Déplace ton doigt · explore
  </div>

</div>


<script>

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = Math.min(window.devicePixelRatio || 1,2);

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();

window.addEventListener("resize",resize);


/* =========================================================
   MEMORY
========================================================= */

let memory = JSON.parse(
  localStorage.getItem("strangeWorld")
  || "{}"
);

memory.visits = (memory.visits || 0) + 1;
memory.distance = memory.distance || 0;
memory.interactions = memory.interactions || 0;
memory.secret = memory.secret || false;
memory.creatureMet = memory.creatureMet || false;
memory.night = memory.night || false;

localStorage.setItem(
  "strangeWorld",
  JSON.stringify(memory)
);

document.getElementById("visitNumber").textContent =
  String(memory.visits).padStart(2,"0");


/* =========================================================
   TIME
========================================================= */

let time = memory.visits > 3
  ? 0.68
  : Math.random();

let targetTime = time;


/* =========================================================
   CAMERA
========================================================= */

let cameraX = 0;
let cameraTargetX = 0;

let cameraY = 0;
let cameraTargetY = 0;


/* =========================================================
   POINTER
========================================================= */

let pointer = {
  x:W/2,
  y:H/2,
  active:false
};

let lastPointerX = W/2;
let lastPointerY = H/2;

window.addEventListener("pointermove",e=>{

  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.active = true;

});

window.addEventListener("pointerdown",e=>{

  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.active = true;

  memory.interactions++;

  if(memory.interactions > 30){
    memory.secret = true;
  }

  saveMemory();

});

window.addEventListener("pointerup",()=>{
  pointer.active=false;
});


/* =========================================================
   STARS
========================================================= */

const stars = [];

function createStars(){

  stars.length = 0;

  const amount = Math.floor(
    Math.max(W,H) * .22
  );

  for(let i=0;i<amount;i++){

    stars.push({

      x:Math.random(),
      y:Math.random()*.62,
      size:Math.random()*1.6+.2,
      twinkle:Math.random()*Math.PI*2,
      speed:Math.random()*.7+.2

    });

  }

}

createStars();


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];

for(let i=0;i<240;i++){

  particles.push({

    x:Math.random(),
    y:Math.random(),
    vx:(Math.random()-.5)*.0004,
    vy:(Math.random()-.5)*.0004,
    size:Math.random()*1.8+.3,
    life:Math.random()*Math.PI*2

  });

}


/* =========================================================
   CREATURE
========================================================= */

const creature = {

  x:.72,
  y:.66,
  targetX:.72,
  targetY:.66,
  visible:false,
  curiosity:0,
  angle:0

};


/* =========================================================
   WORLD EVENTS
========================================================= */

let eventTimer = 0;
let lastEvent = 0;

const messages = [

  "Tu peux rester ici aussi longtemps que tu veux.",

  "Le monde ne se souvient normalement pas des visiteurs.",

  "Quelque chose vient de bouger derrière toi.",

  "Tu regardes cet endroit. Cet endroit te regarde aussi.",

  "Il n'y a aucune raison d'être ici.",

  "La lumière était différente la dernière fois.",

  "Tu n'es pas le premier.",

  "Tu pourrais partir maintenant.",

  "Étrange... tu es revenu.",

  "Certaines choses n'apparaissent qu'après plusieurs visites."

];


function showMessage(text,duration=4500){

  const el =
    document.getElementById("message");

  el.textContent = text;
  el.classList.add("show");

  clearTimeout(showMessage.timer);

  showMessage.timer =
    setTimeout(()=>{
      el.classList.remove("show");
    },duration);

}


/* =========================================================
   INTRO
========================================================= */

document
  .getElementById("enter")
  .addEventListener("click",()=>{

    document
      .getElementById("intro")
      .classList.add("hidden");

    setTimeout(()=>{

      if(memory.visits > 1){

        showMessage(
          memory.visits === 2
            ? "Tu es revenu."
            : "Je savais que tu reviendrais."
        );

      }

    },1800);

  });


/* =========================================================
   DRAW SKY
========================================================= */

function drawSky(){

  const daylight =
    Math.max(
      0,
      Math.sin(time * Math.PI * 2)
    );

  const night =
    1 - daylight;

  const grad =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  if(daylight > .5){

    grad.addColorStop(
      0,
      `rgb(
        ${10+daylight*35},
        ${18+daylight*45},
        ${35+daylight*70}
      )`
    );

    grad.addColorStop(
      1,
      "rgb(40,55,75)"
    );

  }else{

    grad.addColorStop(
      0,
      `rgb(
        ${3+night*4},
        ${5+night*7},
        ${15+night*20}
      )`
    );

    grad.addColorStop(
      1,
      "rgb(8,13,23)"
    );

  }

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);


  /* moon */

  const moonX =
    W*.72 + Math.cos(time*Math.PI*2)*W*.28;

  const moonY =
    H*.18 + Math.sin(time*Math.PI*2)*H*.08;

  ctx.beginPath();

  ctx.arc(
    moonX,
    moonY,
    30,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    `rgba(225,235,255,${night*.8})`;

  ctx.shadowBlur = 40;
  ctx.shadowColor =
    "rgba(180,210,255,.5)";

  ctx.fill();

  ctx.shadowBlur=0;


  /* stars */

  for(const s of stars){

    const alpha =
      night *
      (.25+
      .45*
      Math.sin(
        performance.now()*.001*s.speed+
        s.twinkle
      ));

    if(alpha <= 0) continue;

    ctx.fillStyle =
      `rgba(220,230,255,${alpha})`;

    ctx.beginPath();

    ctx.arc(
      s.x*W,
      s.y*H,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   MOUNTAINS
========================================================= */

function mountainLayer(base,amp,color,offset){

  ctx.beginPath();

  ctx.moveTo(0,H*base);

  const points = 18;

  for(let i=0;i<=points;i++){

    const x =
      i/points*W;

    const n =
      Math.sin(i*2.4+offset)*.5+
      Math.sin(i*.73+offset*1.7)*.3+
      Math.sin(i*4.8)*.2;

    const y =
      H*base -
      n*H*amp;

    ctx.lineTo(x,y);

  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();

  ctx.fillStyle=color;

  ctx.fill();

}


/* =========================================================
   WATER
========================================================= */

function drawWater(){

  const waterTop = H*.69;

  const grad =
    ctx.createLinearGradient(
      0,waterTop,
      0,H
    );

  grad.addColorStop(
    0,
    "rgba(19,35,55,.9)"
  );

  grad.addColorStop(
    1,
    "rgba(3,9,17,1)"
  );

  ctx.fillStyle=grad;

  ctx.fillRect(
    0,
    waterTop,
    W,
    H-waterTop
  );


  const reflectionX =
    W*.72 + Math.cos(time*Math.PI*2)*W*.28;

  for(let i=0;i<35;i++){

    const y =
      waterTop+10+i*8;

    const width =
      20+
      Math.sin(i*2.1)*15+
      i*2;

    const x =
      reflectionX-width/2+
      Math.sin(
        performance.now()*.001+i
      )*20;

    ctx.strokeStyle =
      `rgba(170,200,255,${.02+(1-i/40)*.08})`;

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.lineTo(x+width,y);

    ctx.stroke();

  }

}


/* =========================================================
   ISLAND
========================================================= */

function drawIsland(){

  const cx =
    W*.53 - cameraX*.15;

  const cy =
    H*.72;

  ctx.beginPath();

  ctx.moveTo(
    cx-W*.55,
    cy
  );

  for(let i=0;i<=30;i++){

    const x =
      cx-W*.55+
      i/30*W*1.1;

    const noise =
      Math.sin(i*.65)*18+
      Math.sin(i*1.83)*7;

    const y =
      cy -
      35 -
      noise;

    ctx.lineTo(x,y);

  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);

  ctx.closePath();

  ctx.fillStyle="#070e14";

  ctx.fill();


  /* distant lights */

  if(memory.visits >= 3){

    for(let i=0;i<5;i++){

      const x =
        W*.28+i*W*.11;

      const y =
        H*.58+
        Math.sin(i*8)*12;

      ctx.fillStyle=
        "rgba(255,215,140,.65)";

      ctx.shadowBlur=15;
      ctx.shadowColor=
        "rgba(255,190,100,.5)";

      ctx.fillRect(x,y,2,2);

      ctx.shadowBlur=0;

    }

  }

}


/* =========================================================
   TREES
========================================================= */

function drawTrees(){

  const count =
    memory.visits >= 4 ? 18 : 11;

  for(let i=0;i<count;i++){

    const x =
      W*.12+
      i*(W*.76/(count-1))+
      Math.sin(i*7.3)*20;

    const ground =
      H*.67+
      Math.sin(i*2.1)*18;

    const height =
      45+
      Math.sin(i*1.7)*18;

    ctx.strokeStyle=
      "rgba(7,13,16,.95)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(x,ground);
    ctx.lineTo(x,ground-height);

    ctx.stroke();


    for(let j=0;j<3;j++){

      ctx.beginPath();

      ctx.moveTo(
        x,
        ground-height+j*12
      );

      ctx.lineTo(
        x-15-j*2,
        ground-height+20+j*10
      );

      ctx.moveTo(
        x,
        ground-height+j*12
      );

      ctx.lineTo(
        x+15+j*2,
        ground-height+20+j*10
      );

      ctx.stroke();

    }

  }

}


/* =========================================================
   CREATURE
========================================================= */

function drawCreature(){

  if(!creature.visible) return;

  creature.angle += .015;

  creature.x +=
    (creature.targetX-creature.x)*.002;

  creature.y +=
    (creature.targetY-creature.y)*.002;


  const x =
    creature.x*W+
    Math.sin(creature.angle)*7;

  const y =
    creature.y*H+
    Math.cos(creature.angle*1.3)*4;


  /* glow */

  const glow =
    ctx.createRadialGradient(
      x,y,0,
      x,y,45
    );

  glow.addColorStop(
    0,
    "rgba(120,230,220,.3)"
  );

  glow.addColorStop(
    1,
    "rgba(120,230,220,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    x-50,
    y-50,
    100,
    100
  );


  /* body */

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    13,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(140,220,215,.85)";

  ctx.shadowBlur=18;
  ctx.shadowColor=
    "rgba(100,240,220,.8)";

  ctx.fill();

  ctx.shadowBlur=0;


  /* eyes */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    x-5,
    y-2,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+5,
    y-2,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

  for(const p of particles){

    p.x += p.vx;
    p.y += p.vy;

    if(p.x<0) p.x=1;
    if(p.x>1) p.x=0;
    if(p.y<0) p.y=1;
    if(p.y>1) p.y=0;

    const distance =
      Math.hypot(
        p.x*W-pointer.x,
        p.y*H-pointer.y
      );

    let alpha=.12;

    if(distance<180){

      alpha=.45;

      p.x +=
        (p.x*W-pointer.x)/
        distance*.0007;

      p.y +=
        (p.y*H-pointer.y)/
        distance*.0007;

    }

    ctx.fillStyle=
      `rgba(170,210,230,${alpha})`;

    ctx.beginPath();

    ctx.arc(
      p.x*W,
      p.y*H,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   INTERACTION
========================================================= */

function updateInteraction(){

  if(!pointer.active) return;

  cameraTargetX =
    (pointer.x-W/2)/W*80;

  cameraTargetY =
    (pointer.y-H/2)/H*30;


  cameraX +=
    (cameraTargetX-cameraX)*.02;

  cameraY +=
    (cameraTargetY-cameraY)*.02;


  const distance =
    Math.hypot(
      pointer.x-W*.72,
      pointer.y-H*.64
    );


  if(
    distance<120 &&
    memory.visits>=2
  ){

    creature.visible=true;
    memory.creatureMet=true;

    creature.targetX =
      pointer.x/W;

    creature.targetY =
      pointer.y/H-.03;

    saveMemory();

  }

}


/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvents(){

  const now =
    performance.now()/1000;

  if(now-lastEvent<15) return;

  if(Math.random()<.22){

    lastEvent=now;

    const available =
      memory.visits>=3
      ? messages
      : messages.slice(0,7);

    const text =
      available[
        Math.floor(
          Math.random()*available.length
        )
      ];

    showMessage(text);

  }


  /* special event */

  if(
    memory.visits>=5 &&
    !memory.secret &&
    Math.random()<.15
  ){

    memory.secret=true;

    saveMemory();

    showMessage(
      "Tu as été ici assez longtemps."
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveMemory(){

  localStorage.setItem(
    "strangeWorld",
    JSON.stringify(memory)
  );

}


/* =========================================================
   MEMORY TEXT
========================================================= */

function updateMemoryText(){

  const el =
    document.getElementById("memory");

  if(memory.visits===1){

    el.innerHTML =
      "LE MONDE EST NE<br>AVEC TOI";

  }else if(memory.visits===2){

    el.innerHTML =
      "IL SE SOUVIENT<br>DE TA PREMIÈRE VISITE";

  }else if(memory.visits<5){

    el.innerHTML =
      "VISITES : "+memory.visits+
      "<br>LE MONDE CHANGE";

  }else{

    el.innerHTML =
      "VISITES : "+memory.visits+
      "<br>IL TE CONNAÎT";

  }

}

updateMemoryText();


/* =========================================================
   MAIN LOOP
========================================================= */

let previous = performance.now();

function animate(now){

  const dt =
    Math.min(
      (now-previous)/1000,
      .05
    );

  previous=now;


  /* time */

  time += dt*.003;

  if(time>1){
    time-=1;
  }


  /* camera */

  cameraX +=
    (cameraTargetX-cameraX)*.03;

  cameraY +=
    (cameraTargetY-cameraY)*.03;


  /* draw */

  drawSky();

  mountainLayer(
    .57,
    .10,
    "rgba(12,19,31,.95)",
    cameraX*.002
  );

  mountainLayer(
    .64,
    .07,
    "rgba(7,14,21,.98)",
    cameraX*.004
  );

  drawWater();

  drawIsland();

  drawTrees();

  drawParticles();

  updateInteraction();

  drawCreature();

  randomEvents();


  requestAnimationFrame(animate);

}

requestAnimationFrame(animate);


/* =========================================================
   SECRET: LONG PRESS / CLICK
========================================================= */

let pressTimer;

window.addEventListener("pointerdown",()=>{

  pressTimer =
    setTimeout(()=>{

      if(memory.visits>=2){

        showMessage(
          "Tu viens de trouver quelque chose que personne ne cherchait."
        );

        creature.visible=true;

        creature.x=.5;
        creature.y=.55;

      }

    },2500);

});


window.addEventListener("pointerup",()=>{

  clearTimeout(pressTimer);

});


/* =========================================================
   RETURN VISITOR
========================================================= */

if(memory.visits>=2){

  setTimeout(()=>{

    showMessage(
      memory.visits===2
        ? "La deuxième fois est toujours différente."
        : "Tu connais déjà le chemin."
    );

  },5000);

}


/* =========================================================
   EASTER EGG
========================================================= */

let keySequence="";

window.addEventListener("keydown",e=>{

  keySequence += e.key.toLowerCase();

  if(keySequence.length>12){
    keySequence =
      keySequence.slice(-12);
  }

  if(keySequence.includes("secret")){

    showMessage(
      "Tu n'étais pas censé trouver ça."
    );

    memory.secret=true;
    saveMemory();

    keySequence="";

  }

});

</script>

</body>
</html>

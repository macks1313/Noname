<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142622"><title>Lady Briefington — Explorer les Îles de Brume</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142622;color:#eee5d0;font-family:Georgia,serif}#world{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;z-index:4;top:0;left:0;right:0;height:62px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0c1918dd,transparent);pointer-events:none}.brand,.status{pointer-events:auto}.brand{display:flex;align-items:center;gap:10px}.seal{width:36px;height:36px;border:1px solid #d8b77d;border-radius:50%;display:grid;place-items:center;color:#d8b77d;font-size:22px;font-style:italic}.brand b{font-size:17px;letter-spacing:.08em;font-weight:normal}.brand b span{color:#d8b77d}.brand small{display:block;font:8px Arial;letter-spacing:.2em;color:#c1c4b2;margin-top:3px}.status{font:9px Arial;letter-spacing:.12em;color:#e1e4d0;background:#10211ed9;border:1px solid #85917b66;border-radius:20px;padding:9px 12px}
.help{position:fixed;z-index:3;top:76px;left:50%;transform:translateX(-50%);background:#10211edb;border:1px solid #a5a58a55;border-radius:4px;padding:8px 12px;font:9px Arial;letter-spacing:.12em;white-space:nowrap;text-align:center;pointer-events:none}
.joystick{position:fixed;z-index:5;left:18px;bottom:24px;width:126px;display:flex;flex-direction:column;align-items:center;gap:7px;touch-action:none;user-select:none}.base{width:108px;height:108px;border-radius:50%;border:2px solid #ead9b2;background:radial-gradient(circle at 35% 30%,#657c6d,#18312e 72%);display:grid;place-items:center;box-shadow:0 5px 22px #0009,inset 0 0 15px #e4c58a44;touch-action:none}.knob{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#f8e8c4,#b68d50);border:2px solid #fff0c9;box-shadow:0 3px 12px #000b;pointer-events:none}.joystick small{font:800 8px Arial;letter-spacing:.16em;text-shadow:0 2px 5px #000}
.hud{position:fixed;z-index:4;right:15px;bottom:20px;width:230px;background:#10211ee8;border:1px solid #8c967b66;border-radius:6px;padding:12px 14px;pointer-events:none}.hudhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.hudhead b{font:italic 16px Georgia}.hudhead small{font:8px Arial;color:#d8b77d;letter-spacing:.1em}.hud p{font:11px/1.5 Georgia;color:#e7d8b8;margin:7px 0 0}.hud .thought{font:9px/1.5 Arial;color:#b8c4b2;margin-top:5px}
.actions{position:fixed;z-index:5;right:15px;top:76px;display:flex;gap:6px}.actions button,.menu button{background:#10211ee8;border:1px solid #9ca58b77;color:#eee5d0;border-radius:4px;padding:9px 11px;font:9px Arial;letter-spacing:.06em}
.menu{position:fixed;z-index:6;top:126px;right:15px;display:flex;flex-direction:column;gap:5px}.menu button{text-align:left;min-width:125px}
.overlay{display:none;position:fixed;z-index:10;inset:0;background:#071311b8;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:15px}.overlay.open{display:flex}.sheet{width:min(650px,100%);max-height:80vh;overflow:auto;background:#192d29;border:1px solid #87947c;border-radius:8px;padding:19px;box-shadow:0 25px 80px #000b}.sheethead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #506257;padding-bottom:12px;margin-bottom:12px}.sheet h2{font:normal 24px Georgia;margin:0}.close{background:transparent;border:1px solid #87947c;border-radius:4px;padding:8px 10px;color:#eee5d0;font:9px Arial}.entry{padding:12px 0;border-bottom:1px solid #40564c}.entry small{font:8px Arial;color:#d8b77d;letter-spacing:.12em}.entry b{display:block;font:italic 16px Georgia;margin:5px 0}.entry p,.intro{font:11px/1.6 Arial;color:#c0c7b5;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#203a34;border:1px solid #50675b;border-radius:5px;padding:12px}.tile b{font:italic 15px Georgia}.tile p{font:10px/1.5 Arial;color:#bfc7b4}.field{width:100%;background:#0e201d;border:1px solid #627467;border-radius:4px;color:#eee5d0;padding:11px;font:12px Arial;margin:7px 0}.gold{background:#d8b77d;color:#1a2924;border:0;border-radius:4px;padding:11px 14px;font:800 9px Arial;letter-spacing:.12em}.toast{position:fixed;z-index:12;top:70px;left:50%;transform:translateX(-50%);background:#efe4c9;color:#182723;padding:10px 14px;border-radius:4px;font:11px Arial;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:680px){.top{height:52px;padding:7px 10px}.seal{width:31px;height:31px}.brand b{font-size:14px}.brand small{font-size:6px}.status{font-size:7px;padding:7px 8px}.help{top:108px;font-size:7px;padding:7px 9px;max-width:calc(100vw - 24px);white-space:normal;line-height:1.4}.actions{top:auto;bottom:158px;right:9px;flex-direction:column}.actions button{padding:8px}.menu{top:59px;right:8px;flex-direction:row;max-width:calc(100vw - 16px);overflow-x:auto}.menu button{min-width:0;padding:8px 9px;font-size:8px;white-space:nowrap}.joystick{left:8px;bottom:15px;width:105px}.base{width:92px;height:92px}.knob{width:41px;height:41px}.joystick small{font-size:7px}.hud{right:8px;bottom:18px;width:min(190px,calc(100vw - 125px));padding:9px}.hudhead b{font-size:13px}.hud p{font-size:10px}.hud .thought{font-size:8px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="world"></div><header class="top"><div class="brand"><div class="seal">L</div><div><b>LADY <span>BRIEFINGTON</span></b><small>LES ÎLES DE BRUME · MONDE À EXPLORER</small></div></div><div class="status" id="clock">MONDE ÉVEILLÉ</div></header>
<div class="help">TU ES UN VISITEUR · EXPLORE L'ÎLE POUR RETROUVER LADY BRIEFINGTON</div>
<div class="actions"><button id="home">◎ ME REPLACER</button><button id="zoom">＋ ZOOM</button></div>
<nav class="menu"><button data-panel="journal">☷ Journal</button><button data-panel="bag">▣ Sac à dos</button><button data-panel="discoveries">◇ Découvertes</button><button data-panel="letter">✉ Lui écrire</button></nav>
<div class="joystick" id="joy"><div class="base"><div class="knob" id="knob"></div></div><small>TE DÉPLACER</small></div>
<div class="hud"><div class="hudhead"><b>Lady Briefington</b><small id="ladyState">EN EXPLORATION</small></div><p id="doing">Elle se promène quelque part sur l'île…</p><div class="thought" id="thought">Tu peux partir à sa recherche.</div></div>
<div class="toast" id="toast"></div><div class="overlay" id="overlay"><section class="sheet"><div class="sheethead"><h2 id="title">Journal</h2><button class="close" id="close">FERMER ✕</button></div><div id="body"></div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),host=$('world');
if(!window.THREE){$('doing').textContent='Le monde 3D n’a pas pu se charger. Vérifie ta connexion puis recharge la page.';return}
const THREE=window.THREE,scene=new THREE.Scene();scene.background=new THREE.Color(0x294b49);scene.fog=new THREE.Fog(0x294b49,35,95);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(0,13,17);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f0d6,0x3a5148,1.35));const sun=new THREE.DirectionalLight(0xffe3b2,1.6);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.9)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x315b59));ocean.rotation.x=-Math.PI/2;ocean.position.y=-.45;scene.add(ocean);
const islandMat=mat(0x839778),sandMat=mat(0xc9b98e),pathMat=mat(0xb6a47a),treeMat=mat(0x355b47),trunkMat=mat(0x68543c),rockMat=mat(0x778078),roofMat=mat(0x8d5742);
function island(x,z,rx,rz,seed){const seg=96,verts=[],idx=[];verts.push(x,0,z);for(let ring=1;ring<=7;ring++){let t=ring/7;for(let i=0;i<seg;i++){let a=i/seg*Math.PI*2,n=1+.09*Math.sin(a*3+seed)+.045*Math.cos(a*7+seed*2);let px=x+Math.cos(a)*rx*t*n,pz=z+Math.sin(a)*rz*t*n;let h=(1-t)*(.35+Math.sin(a*4+seed)*.17)+.03;verts.push(px,h,pz)}}for(let i=0;i<seg;i++)idx.push(0,1+(i+1)%seg,1+i);for(let r=0;r<6;r++){let s=1+r*seg,n=s+seg;for(let i=0;i<seg;i++){let j=(i+1)%seg;idx.push(s+i,s+j,n+i,s+j,n+j,n+i)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();let mesh=new THREE.Mesh(geo,islandMat);mesh.receiveShadow=true;mesh.castShadow=true;scene.add(mesh);const shore=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.45,96,1,true),sandMat);shore.scale.set(rx,1,rz);shore.position.set(x,-.08,z);scene.add(shore)}
island(0,0,12,9,2);island(-18,-12,4.8,3.8,6);island(18,9,5,4,8);island(-20,16,3.5,3,11);
function path(points,r=.16){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.12,p[1])));let mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,70,r,7,false),pathMat);scene.add(mesh)}
path([[-9,2],[-5,0],[-1,-2],[4,-1],[8,3]]);path([[-2,-2],[0,2],[3,5],[7,6]]);
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,.8*s,7),trunkMat);trunk.position.set(x,.4*s,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<3;i++){let crown=new THREE.Mesh(new THREE.ConeGeometry((.65-i*.1)*s,.95*s,7),treeMat);crown.position.set(x,.95*s+i*.42*s,z);crown.castShadow=true;scene.add(crown)}}
for(let i=0;i<85;i++){let a=i*2.399,r=2.5+Math.sqrt(i%25)*.37,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)<10.7&&Math.hypot(x+2,z+2)>2.5)tree(x,z,.65+(i%4)*.12)}
function rock(x,z,s){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockMat);m.position.set(x,s*.45,z);m.scale.y=.7;m.castShadow=true;scene.add(m)}
for(let i=0;i<23;i++){let a=i*2.4,r=9+Math.sin(i)*1.3;rock(Math.cos(a)*r,Math.sin(a)*r,.45+(i%3)*.18)}
// Landmarks
const places=[{name:'Le Phare des Oubliés',x:-8,z:-4,desc:'Un phare dont la lanterne s’allume parfois sans électricité.'},{name:'La Baie de Verre',x:8,z:-4,desc:'Des éclats de verre marin brillent au bord de l’eau.'},{name:'Le Verger noyé',x:4,z:6,desc:'Des arbres étranges poussent près de la lagune.'},{name:'Les Ruines du Sonneur',x:18,z:9,desc:'Un village oublié derrière les rochers.'},{name:'Le Sentier silencieux',x:-18,z:-12,desc:'Un chemin qui semble changer lorsque personne ne le regarde.'}];
function building(x,z){const base=new THREE.Mesh(new THREE.CylinderGeometry(.8,.95,1.3,8),mat(0xd0c2a1));base.position.set(x,.7,z);base.castShadow=true;scene.add(base);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.05,.8,8),roofMat);roof.position.set(x,1.75,z);scene.add(roof)}
building(-8,-4);building(4,6);
function label(text,x,z){const cv=document.createElement('canvas');cv.width=512;cv.height=96;const c=cv.getContext('2d');c.fillStyle='rgba(17,32,28,.82)';c.fillRect(4,4,504,88);c.strokeStyle='#d8b77d';c.strokeRect(4,4,504,88);c.fillStyle='#f1e7d1';c.font='28px Georgia';c.textAlign='center';c.fillText(text,256,59);const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.position.set(x,2.7,z);sp.scale.set(5.2,.98,1);scene.add(sp)}
places.forEach(p=>label(p.name,p.x,p.z));
// Character models: visitor and Lady are independent agents.
function person(coat,hat){const group=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.68,4,8),mat(coat));body.position.y=.82;body.castShadow=true;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),mat(0xe4c7a5));head.position.y=1.48;group.add(head);const cap=new THREE.Mesh(new THREE.ConeGeometry(.32,.22,8),mat(hat));cap.position.y=1.73;group.add(cap);const pack=new THREE.Mesh(new THREE.BoxGeometry(.35,.42,.2),mat(0x6b5137));pack.position.set(0,.88,-.28);group.add(pack);scene.add(group);return group}
const visitor=person(0x416d81,0xd9d7c5);visitor.position.set(1,0,2);
const lady=person(0x9b5145,0xd8b77d);lady.position.set(-8,0,-4);
const ring=new THREE.Mesh(new THREE.RingGeometry(.52,.61,32),new THREE.MeshBasicMaterial({color:0xf2d28f,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;visitor.add(ring);
let saved={bag:['Éclat de cuivre gravé','Verre marin bleuté'],found:['Le Phare des Oubliés','La Baie de Verre'],journal:[{day:1,text:'Je suis arrivée sur les Îles de Brume. La brume cache encore bien des choses.'}],letters:[],day:1};
try{saved={...saved,...JSON.parse(localStorage.getItem('lady3d-v1')||'{}')}}catch(e){}
const persist=()=>{try{localStorage.setItem('lady3d-v1',JSON.stringify(saved))}catch(e){}};
let joy={x:0,y:0},pressed=false,keys={},ladyTarget=0,ladyPause=0,last=performance.now(),clock=8*60,visited=new Set(),zoom=1;
let ladyAction='Elle explore les environs du phare.',ladyThought='Je me demande ce qui se cache derrière ces arbres.';
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function log(t){saved.journal.unshift({day:saved.day,text:t});saved.journal=saved.journal.slice(0,70);persist()}
function arriveLady(p){if(!saved.found.includes(p.name)){saved.found.push(p.name);let item=['Une plume grise','Un fragment de carte','Une petite pierre polie','Une fleur séchée','Une clé rouillée'][saved.bag.length%5];saved.bag.push(item);log('J’ai découvert '+p.name+'. '+p.desc+' J’ai gardé : '+item+'.');ladyAction='Elle a découvert '+p.name+'.';ladyThought=p.desc;say('Lady Briefington a fait une découverte !')}else{ladyAction='Elle observe '+p.name+'.';ladyThought='Je crois que j’avais manqué quelque chose la première fois.'}persist()}
function chooseLady(){ladyTarget=(ladyTarget+1+Math.floor(Math.random()*places.length))%places.length;let p=places[ladyTarget];ladyAction='Elle se dirige vers '+p.name+'.';ladyThought='Un nouvel endroit mérite qu’on s’y attarde.'}
function panel(name){if(name==='close'){$('overlay').classList.remove('open');return}let title='',html='';if(name==='journal'){title='Journal de bord';html='<p class="intro">Les récits que Lady Briefington écrit au fil de ses aventures.</p>'+saved.journal.map(x=>'<div class="entry"><small>JOUR '+x.day+'</small><p>'+esc(x.text)+'</p></div>').join('')}if(name==='bag'){title='Sac à dos';html='<p class="intro">Les objets qu’elle a récoltés sur les îles.</p><div class="grid">'+saved.bag.map(x=>'<div class="tile"><b>◇ '+esc(x)+'</b><p>Objet trouvé par Lady Briefington.</p></div>').join('')+'</div>'}if(name==='discoveries'){title='Atlas des découvertes';html='<div class="grid">'+places.map(p=>'<div class="tile"><b>'+ (saved.found.includes(p.name)?'✦ ':'◇ ') +esc(p.name)+'</b><p>'+esc(p.desc)+'</p></div>').join('')+'</div>'}if(name==='letter'){title='Lui laisser un message';html='<p class="intro">Dépose un mot pour Lady Briefington. Elle pourra le découvrir quand elle passera près de sa boîte aux lettres.</p><input class="field" id="who" maxlength="30" placeholder="Ton prénom (facultatif)"><textarea class="field" id="letter" rows="4" maxlength="350" placeholder="Ton message…"></textarea><button class="gold" id="send">DÉPOSER LE MESSAGE</button><p class="intro">Les messages sont actuellement conservés sur cet appareil uniquement.</p>'}
$('title').textContent=title;$('body').innerHTML=html;$('overlay').classList.add('open');if(name==='letter')$('send').onclick=()=>{let msg=$('letter').value.trim();if(!msg){say('Écris un message avant de le déposer.');return}saved.letters.push({name:$('who').value.trim()||'Un visiteur',text:msg});log('Un visiteur a déposé une lettre. Je la lirai lorsque je serai de retour.');persist();$('body').innerHTML='<p class="intro">Ton message a été déposé. Il attendra Lady Briefington.</p>';say('Message déposé')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));$('close').onclick=()=>panel('close');$('overlay').onclick=e=>{if(e.target===$('overlay'))panel('close')};
function joyMove(e){if(!pressed)return;let r=$('joy').querySelector('.base').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=31,l=Math.hypot(dx,dy),s=l>m?m/l:1;dx*=s;dy*=s;joy={x:dx/m,y:dy/m};$('knob').style.transform='translate('+dx+'px,'+dy+'px)'}
function joyStop(){pressed=false;joy={x:0,y:0};$('knob').style.transform='translate(0,0)'}
$('joy').onpointerdown=e=>{e.preventDefault();pressed=true;$('joy').setPointerCapture(e.pointerId);joyMove(e)};$('joy').onpointermove=joyMove;$('joy').onpointerup=joyStop;$('joy').onpointercancel=joyStop;
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('home').onclick=()=>{camera.position.set(visitor.position.x,visitor.position.y+13,visitor.position.z+17);camera.lookAt(visitor.position.x,0,visitor.position.z);say('Tu es ici.')};$('zoom').onclick=()=>{zoom=Math.max(.75,zoom-.15);camera.fov=48*zoom;camera.updateProjectionMatrix()};
const clockEl=$('clock');
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-last)/1000);last=t;
let dx=joy.x, dz=joy.y;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;let l=Math.hypot(dx,dz);if(l>.05){dx/=Math.max(1,l);dz/=Math.max(1,l);visitor.position.x+=dx*5.5*dt;visitor.position.z+=dz*5.5*dt;visitor.position.x=Math.max(-25,Math.min(25,visitor.position.x));visitor.position.z=Math.max(-20,Math.min(20,visitor.position.z));visitor.rotation.y=Math.atan2(dx,dz)}
// Camera follows the visitor: joystick moves the visitor through the 3D world, not the map.
let desired=new THREE.Vector3(visitor.position.x,visitor.position.y+10.5,visitor.position.z+13);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(visitor.position.x,0,visitor.position.z);
// Lady follows her own route independently.
if(ladyPause>0)ladyPause-=dt;else{let p=places[ladyTarget];let vx=p.x-lady.position.x,vz=p.z-lady.position.z,d=Math.hypot(vx,vz);if(d<.45){arriveLady(p);ladyPause=3.5;chooseLady()}else{lady.position.x+=vx/d*1.35*dt;lady.position.z+=vz/d*1.35*dt;lady.rotation.y=Math.atan2(vx,vz)}}
lady.position.y=Math.sin(t*.004)*.035;visitor.position.y=Math.sin(t*.009)*.025;
clock+=dt*1.1;if(clock>1440){clock-=1440;saved.day++}clockEl.textContent='JOUR '+String(saved.day).padStart(2,'0')+' · '+String(Math.floor(clock/60)).padStart(2,'0')+':'+String(Math.floor(clock%60)).padStart(2,'0');
$('doing').textContent=ladyAction;$('thought').textContent='« '+ladyThought+' »';
if(Math.hypot(visitor.position.x-lady.position.x,visitor.position.z-lady.position.z)<2.3&&!visited.has(ladyTarget)){visited.add(ladyTarget);say('Tu as retrouvé Lady Briefington !');}
renderer.render(scene,camera)}
chooseLady();requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>

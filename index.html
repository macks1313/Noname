<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Immeuble 7B</title>
<meta name="description" content="Un immeuble en pixel art à explorer : neuf appartements animés, des objets à toucher, du matin à la nuit.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="view"><canvas id="c" aria-label="Immeuble en pixel art avec neuf appartements"></canvas></div>
<nav>

  <button type="button" data-t="soir">Soir</button>
  <button type="button" data-t="nuit">Nuit</button>
  <button type="button" id="fit">Tout voir</button>
  <button type="button" id="rain">Pluie</button>

<div id="toast" role="status"></div>

<script src="app.js"></script>

</html>

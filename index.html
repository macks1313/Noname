<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#282633"><title>THE LITTLE THING — A tiny life in the attic</title>
<style>
:root{--ink:#302b39;--paper:#f7efdf;--muted:#9b8b83;--copper:#c18b62;--sage:#9caa91;--plum:#75657e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#282633;color:var(--paper);font-family:system-ui,-apple-system,Arial,sans-serif}#scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#786b68,#373342 65%,#24232e);overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
#header{position:absolute;z-index:3;top:0;left:0;right:0;padding:20px 22px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#272531dd,transparent);pointer-events:none}.brand{font:italic 25px Georgia,serif;letter-spacing:.04em}.tag{font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:#d5b99b;margin-top:4px}.day{font-size:10px;letter-spacing:.14em;color:#e5c6a3;border:1px solid #b99b7b66;border-radius:30px;padding:8px 12px;background:#28263377}
#caption{position:absolute;z-index:3;top:104px;left:50%;transform:translateX(-50%);text-align:center;width:min(85%,520px);font:italic 15px Georgia,serif;color:#f2dfc6;text-shadow:0 2px 12px #191821}
#bottom{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:38px 18px 18px;background:linear-gradient(transparent,#25232ff0 45%);display:flex;justify-content:space-between;align-items:end;gap:10px}
#status{font-size:10px;line-height:1.7;color:#c8b9ad;max-width:175px}#status strong{color:#f0d5b2;font:italic 17px Georgia,serif}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button,.panel button{border:1px solid #c3a17c88;background:#393542dd;color:#f4e8d8;padding:10px 12px;border-radius:9px;font-size:10px;letter-spacing:.06em}
#panel{display:none;position:absolute;z-index:8;right:14px;top:72px;width:min(360px,calc(100% - 28px));max-height:70vh;overflow:auto;padding:20px;background:#f5eddf;color:#332e39;border-radius:14px;box-shadow:0 18px 60px #0009;border:1px solid #d2b895}
#panel h2{font:italic 27px Georgia,serif;margin:0 0 12px;color:#765d62}#panel p{font:13px/1.65 Georgia,serif;color:#645b5c}#panel .close{float:right;background:transparent;color:#51454a;border-color:#c9b8a2}#panel button{background:#75657e;color:white;border:0;margin:4px 3px 4px 0} .entry{padding:12px 0;border-top:1px solid #ddcfbc}.entry b{font:italic 17px Georgia,serif}.entry small{display:block;color:#8d7d76;margin-top:4px}.artifact{display:flex;gap:12px;align-items:center}.thumb{width:72px;height:72px;flex:none;border-radius:8px;background:linear-gradient(145deg,#d2b68f,#796e80 55%,#b4a88e);position:relative;overflow:hidden}.thumb:before{content:"";position:absolute;width:34px;height:34px;border:3px solid #f4e3c8;border-radius:50%;left:18px;top:18px;box-shadow:0 0 0 7px #f4e3c833}
#toast{position:absolute;z-index:9;left:50%;bottom:115px;transform:translateX(-50%);padding:10px 15px;border-radius:30px;background:#f3e5cd;color:#403845;font-size:11px;opacity:0;transition:.25s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:600px){#header{padding:15px}.brand{font-size:21px}#caption{top:86px;font-size:13px}#bottom{padding:32px 12px 14px;align-items:end}#status{max-width:120px;font-size:9px}.actions button{padding:9px 10px;font-size:9px}.actions{max-width:220px}}
</style></head><body>
<div id="scene"><canvas id="world"></canvas><div id="grain"></div></div>
<header id="header"><div><div class="brand">The Little Thing</div><div class="tag">A tiny life in a forgotten attic</div></div><div class="day">DAY <b id="day">01</b></div></header>
<div id="caption">Somewhere between dust and starlight, a little life is unfolding.</div>
<footer id="bottom"><div id="status"><strong>Mimo</strong><br><span id="activity">Listening to the rain...</span><br><span id="mood">Mood · curious</span></div><div class="actions"><button id="journalBtn">✎ JOURNAL</button><button id="museumBtn">✧ COLLECTION</button><button id="workshopBtn">⚙ WORKSHOP</button><button id="pauseBtn">Ⅱ PAUSE</button></div></footer>
<aside id="panel"><button class="close" id="closePanel">CLOSE ✕</button><h2 id="panelTitle">Mimo's notes</h2><div id="panelBody"></div></aside><div id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,last=0,elapsed=0,paused=false,toastTimer=0;
const saveKey='littlething-save-v1';
const names=['A moon made of tin','The quietest bell','A pocket for lost wishes','Rain caught in a thimble','The clockwork firefly','A map of almost-nowhere','The little brass bird'];
let data={day:1,coins:0,discoveries:0,works:[],journal:[],x:.48,y:.69,targetX:.65,targetY:.67,activity:'Listening to the rain...',mood:'curious',last:Date.now(),paused:false};
try{const old=JSON.parse(localStorage.getItem(saveKey)||'null');if(old)data={...data,...old}}catch(e){}
function save(){data.last=Date.now();localStorage.setItem(saveKey,JSON.stringify(data))}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function log(text){data.journal.unshift({day:data.day,text,at:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});data.journal=data.journal.slice(0,40);save()}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function createWork(){const title=names[(data.works.length+data.day-1)%names.length];const work={title,day:data.day,price:2+data.works.length%4,seed:data.day*13+data.works.length*7};data.works.unshift(work);data.discoveries++;data.activity='Making '+title.toLowerCase();data.mood='inspired';log('Mimo made something: '+title+'. He left it on the little shelf.');say('A new invention appeared in the workshop.');}
function choose(){const r=Math.random();if(r<.36){data.activity='Following a stripe of sunlight';data.targetX=.18+Math.random()*.65;data.targetY=.54+Math.random()*.19;data.mood='curious'}else if(r<.68){data.activity='Searching through forgotten things';data.targetX=.12+Math.random()*.72;data.targetY=.68+Math.random()*.1;data.mood='focused'}else if(r<.88){createWork();data.targetX=.75;data.targetY=.69}else{data.activity='Taking a tiny nap';data.targetX=data.x;data.targetY=data.y;data.mood='sleepy'}log(data.activity+'.');}
function offline(){const hours=Math.min(12,Math.max(0,(Date.now()-(data.last||Date.now()))/3600000));if(hours>=.15){const days=Math.floor(hours/2.5);if(days){data.day+=days;log('While you were away, '+days+' quiet day(s) passed in the attic.')}if(Math.random()<Math.min(.8,hours*.12))createWork();data.activity='Waking up after your absence';save()}}
offline();$('day').textContent=String(data.day).padStart(2,'0');
function ellipse(x,y,rx,ry,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(t){ctx.clearRect(0,0,W,H);const wall=ctx.createLinearGradient(0,0,0,H);wall.addColorStop(0,'#8b7c79');wall.addColorStop(.58,'#655b65');wall.addColorStop(1,'#393542');ctx.fillStyle=wall;ctx.fillRect(0,0,W,H);
 // attic roof and beams
 ctx.fillStyle='#4c4653';ctx.beginPath();ctx.moveTo(0,H*.35);ctx.lineTo(W*.5,H*.04);ctx.lineTo(W,H*.35);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 line(0,H*.35,W*.5,H*.04,'#a58b7c',7);line(W*.5,H*.04,W,H*.35,'#a58b7c',7);
 for(let i=0;i<4;i++){const x=W*(.12+i*.25);line(x,H*.27,x+W*.07,H*.72,'#6d5d5b',4)}
 // round window
 const wx=W*.5,wy=H*.27,wr=Math.min(W*.17,H*.17);ellipse(wx,wy,wr+9,wr+9,'#3d3545');ellipse(wx,wy,wr,wr,'#d5ad8c');ellipse(wx,wy,wr-8,wr-8,'#a9b4ad');ellipse(wx,wy,wr-14,wr-14,'#d8c1a0');line(wx-wr,wy,wx+wr,wy,'#8d766a',5);line(wx,wy-wr,wx,wy+wr,'#8d766a',5);
 // distant rooftops
 ctx.fillStyle='#7b777f';for(let i=0;i<7;i++){let x=wx-wr+8+i*(wr*2-16)/6;ctx.beginPath();ctx.moveTo(x,wy+wr-8);ctx.lineTo(x+8,wy+wr-30-Math.sin(i)*9);ctx.lineTo(x+17,wy+wr-8);ctx.fill()}
 // floor
 ctx.fillStyle='#8d7463';ctx.beginPath();ctx.moveTo(0,H*.67);ctx.lineTo(W,H*.67);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 for(let i=0;i<8;i++)line(0,H*(.71+i*.045),W,H*(.71+i*.045),'#b08e70',1);
 // storage boxes
 function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);line(x,y,x+w,y,'#d2ad83',2);line(x+w*.5,y,x+w*.5,y+h,'#594c50',2);ctx.fillStyle='#d2ad83';ctx.fillRect(x+w*.35,y+h*.3,w*.3,5)}
 box(W*.07,H*.56,W*.19,H*.15,'#8d6e5c');box(W*.72,H*.57,W*.21,H*.13,'#716477');
 // work table
 ctx.fillStyle='#58434a';ctx.fillRect(W*.31,H*.65,W*.39,H*.045);ctx.fillRect(W*.34,H*.69,W*.025,H*.17);ctx.fillRect(W*.65,H*.69,W*.025,H*.17);
 // small inventions on table
 ellipse(W*.48,H*.625,18,7,'#c89c6d');line(W*.48,H*.62,W*.48,H*.56,'#e7c99c',3);ellipse(W*.48,H*.55,7,7,'#e9c994');line(W*.48,H*.55,W*.53,H*.51,'#e9c994',2);
 // character Mimo
 const x=data.x*W,y=data.y*H,bob=Math.sin(t*.003)*3;
 ellipse(x,y+24,29,8,'#28232d77');ctx.save();ctx.translate(x,y+bob);
 // little wind-up key
 line(0,-25,0,-43,'#d9b27d',4);line(0,-43,12,-48,'#d9b27d',4);ellipse(14,-49,5,5,'#d9b27d');
 // body like a tiny wooden music-box creature
 ctx.fillStyle='#c49a72';ctx.beginPath();ctx.roundRect(-20,-29,40,52,10);ctx.fill();ctx.strokeStyle='#e8cda5';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#e8d3b5';ctx.beginPath();ctx.roundRect(-14,-21,28,25,7);ctx.fill();
 ellipse(-6,-10,3,4,'#3d3545');ellipse(7,-10,3,4,'#3d3545');ctx.strokeStyle='#8a5d57';ctx.lineWidth=2;ctx.beginPath();ctx.arc(1,-3,5,0,Math.PI);ctx.stroke();
 // little feet
 line(-10,22,-13,28,'#d9b27d',4);line(10,22,13,28,'#d9b27d',4);
 // side crank
 line(20,-7,28,-7,'#d9b27d',3);ellipse(30,-7,4,4,'#e5c38e');
 ctx.restore();
 // dust motes
 for(let i=0;i<22;i++){let px=(i*97+t*.008)%W,py=(i*53+Math.sin(t*.0007+i)*22)%H;ellipse(px,py,1.2,1.2,'#f1d9b477')}
 // labels
 ctx.fillStyle='#f2dfc6';ctx.font='10px Georgia';ctx.textAlign='center';ctx.fillText('THE ATTIC',W*.5,H*.94);
}
function tick(ts){if(!last)last=ts;let dt=Math.min(.05,(ts-last)/1000);last=ts;if(!paused){elapsed+=dt;const dx=data.targetX-data.x,dy=data.targetY-data.y,dist=Math.hypot(dx,dy);if(dist>.005){data.x+=dx*dt*.22;data.y+=dy*dt*.22}else if(Math.random()<dt*.045)choose();if(elapsed>75){elapsed=0;data.day++;$('day').textContent=String(data.day).padStart(2,'0');if(Math.random()<.72)choose();save()}}draw(ts);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
function openPanel(title,html){$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').style.display='block'}
$('closePanel').onclick=()=>$('panel').style.display='none';
$('journalBtn').onclick=()=>openPanel("Mimo's journal",data.journal.length?data.journal.map(e=>'<div class="entry"><b>Day '+e.day+'</b><small>'+e.at+'</small><p>'+e.text+'</p></div>').join(''):'<p>The pages are still empty. Mimo is just beginning his story.</p>');
$('museumBtn').onclick=()=>openPanel('The little collection',data.works.length?data.works.map(w=>'<div class="entry artifact"><div class="thumb"></div><div><b>'+w.title+'</b><small>Created on day '+w.day+' · imagined value '+w.price+' brass buttons</small></div></div>').join(''):'<p>Nothing on the shelf yet. Mimo has to discover a few things first.</p>');
$('workshopBtn').onclick=()=>openPanel('The workshop','<p>A tiny workbench, a drawer full of lost screws and a very ambitious inventor.</p><p><b>'+data.works.length+'</b> creations · <b>'+data.discoveries+'</b> discoveries</p><button id="inspire">GIVE MIMO AN IDEA</button><p class="small">This is a little nudge, not an order. He will decide what to do with it.</p>');
document.addEventListener('click',e=>{if(e.target&&e.target.id==='inspire'){createWork();$('panel').style.display='none'}});
$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';say(paused?'The attic falls quiet.':'Mimo is moving again.');};
$('activity').textContent=data.activity;$('mood').textContent='Mood · '+data.mood;
setInterval(()=>{$('activity').textContent=data.activity;$('mood').textContent='Mood · '+data.mood;save()},8000);
addEventListener('beforeunload',save);log('A new day begins in the attic. Mimo is awake.');
})();
</script></body></html>
